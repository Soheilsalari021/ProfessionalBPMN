<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Mint Green Color Scheme -->
  <defs>
    <linearGradient id="mintGradient" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Interlinked Shapes (Abstract Chain/Infinity) -->
  <path d="M60 60 L140 140" stroke="url(#mintGradient)" stroke-width="20" stroke-linecap="round" stroke-opacity="0.2"/>
  <path d="M140 60 L60 140" stroke="url(#mintGradient)" stroke-width="20" stroke-linecap="round" stroke-opacity="0.2"/>

  <!-- Main Loops -->
  <rect x="40" y="40" width="120" height="120" rx="30" stroke="url(#mintGradient)" stroke-width="12" fill="none" transform="rotate(45 100 100)" />
  
  <!-- Gears -->
  <g transform="translate(100, 70)" fill="url(#mintGradient)">
    <!-- Top Gear -->
    <path d="M100,60 L100,55 L102,55 L103,52 L105,53 L107,51 L108,53 L109,51 L111,53 L110,55 L112,56 L113,54 L115,56 L115,58 L117,59 L116,61 L118,63 L115,63 L115,65 L112,65 L111,67 L109,66 L108,68 L106,67 L105,69 L103,68 L102,70 L100,70" transform="scale(0.8) translate(-106, -60)"/>
    <!-- Simplified Gear Circle -->
    <circle cx="0" cy="0" r="15" stroke="url(#mintGradient)" stroke-width="4" fill="none" />
    <path d="M-18 0 L-22 0 M18 0 L22 0 M0 -18 L0 -22 M0 18 L0 22 M-12 -12 L-16 -16 M12 12 L16 16 M-12 12 L-16 16 M12 -12 L16 -16" stroke="url(#mintGradient)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="url(#mintGradient)"/>
  </g>

  <g transform="translate(100, 130)" fill="url(#mintGradient)">
     <!-- Bottom Gear -->
    <circle cx="0" cy="0" r="15" stroke="url(#mintGradient)" stroke-width="4" fill="none" />
    <path d="M-18 0 L-22 0 M18 0 L22 0 M0 -18 L0 -22 M0 18 L0 22 M-12 -12 L-16 -16 M12 12 L16 16 M-12 12 L-16 16 M12 -12 L16 -16" stroke="url(#mintGradient)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="url(#mintGradient)"/>
  </g>
  
  <!-- Connecting Link -->
  <path d="M100 85 L100 115" stroke="url(#mintGradient)" stroke-width="8" stroke-linecap="round" />

</svg>
